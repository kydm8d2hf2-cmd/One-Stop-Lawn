name: Build and deploy compiled web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile index.html (JSX -> JS, strip runtime Babel)
        run: |
          npm install @babel/standalone@7.23.10
          node osl_prebuild.js index.html index.html
      - name: Stage site files (exclude build/dev junk, keep CNAME + assets)
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='osl_prebuild.js' --exclude='_site' \
            ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
